    name: Bing News RSS
    url: https://www.bing.com/news/search
    type: aggregator
    tier: discovery
    enabled: true
    licencia: "Agregador de enlaces; solo se conservan titulares, resumen corto y URL original. Condiciones de uso pendientes de revisión legal."
    licencia_url: "https://www.bing.com/news"
    fecha_revision: "2026-11-07"
    limite_ritmo: "8 consultas / 6 h"
    justificacion: "Vía de descubrimiento de candidatos; nunca eleva un registro a DOCUMENTADO por sí sola."
