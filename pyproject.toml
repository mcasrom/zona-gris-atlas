[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zonagris"
version = "0.1.0"
description = "Atlas abierto de incidentes de zona gris y amenazas híbridas"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Miguel" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "Pillow>=10,<14",
]
ml = [
  "sentence-transformers>=3.0,<6",
]

[project.scripts]
zonagris = "zonagris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "web"]
