# Vhost preparado para B3. NO INSTALADO.
server {
    listen 80;
    listen [::]:80;
    server_name zonagris.pruebapublica.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zonagris.pruebapublica.com;

    # Proxied en Cloudflare con Authenticated Origin Pull (mTLS).

    root /var/www/atlas-zonagris/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/zonagris.pruebapublica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonagris.pruebapublica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/cf-origin.conf;

    include /etc/nginx/snippets/block-attacks.conf;
    include /etc/nginx/snippets/indexnow.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:html|js|css|json|xml|txt|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:png|ico|svg|webp|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ^~ /api/atlas/ {
        proxy_pass http://127.0.0.1:3033;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
